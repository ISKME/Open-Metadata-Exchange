name: publish-images

# Builds the frontend, API and NNTP images and publishes them to GHCR.
# Branch → environment tag: main → dev, staging → staging, production → production.
# Watchtower on each server pulls the new image for its environment tag.
# A release adds the version and stable tags to these images: see promote-images.yml.

on:
  push:
    branches: [main, staging, production]
  workflow_dispatch:

permissions: {}

env:
  # Registry and owner of the images, the same as in promote-images.yml.
  IMAGE_PREFIX: ghcr.io/odisee-ome-2627

concurrency:
  group: publish-images-${{ github.ref_name }}
  # Never cancel a running production build: every promotion must be published.
  cancel-in-progress: ${{ github.ref_name != 'production' }}

jobs:
  publish:
    # Runs only in the fork odisee-ome-2627/Open-Metadata-Exchange.
    # In the source repository ISKME/Open-Metadata-Exchange (or any other fork)
    # this job is skipped, so it has no effect if the file is ever copied upstream.
    if: github.repository_owner == 'odisee-ome-2627'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ome-api
            dockerfile: Dockerfile-api
          - image: ome-frontend
            dockerfile: Dockerfile-fe
          - image: ome-nntp
            dockerfile: Dockerfile-nntp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine environment tag
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main)       echo "env=dev" >> "$GITHUB_OUTPUT" ;;
            staging)    echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            production) echo "env=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown branch $BRANCH"; exit 1 ;;
          esac
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.env }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.env }}-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
