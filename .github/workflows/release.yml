name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (yyyy.mm.dd)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version format
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          if ! echo "${INPUTS_VERSION}" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "Error: version '${INPUTS_VERSION}' does not match yyyy.mm.dd format"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          gh release create "${INPUTS_VERSION}" \
            --title "${INPUTS_VERSION}" \
            --generate-notes \
            --target main
