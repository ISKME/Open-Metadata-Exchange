name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (yyyy.mm.dd)"
        required: true
        default: ""

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version format
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          if ! echo "${INPUTS_VERSION}" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "Error: version '${INPUTS_VERSION}' does not match yyyy.mm.dd format"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          gh release create "${INPUTS_VERSION}" \
            --title "${INPUTS_VERSION}" \
            --generate-notes \
            --target main

  promote-images:
    # Our fork only (odisee-ome-2627): tag the images of this release as the
    # version and stable. See promote-images.yml.
    needs: release
    if: github.repository_owner == 'odisee-ome-2627'
    permissions:
      contents: read
      packages: write
    # The self-repository form ($/) is new (July 2026) and not yet supported by actionlint.
    uses: ./.github/workflows/promote-images.yml  # zizmor: ignore[self-repository]
    with:
      version: ${{ inputs.version }}
