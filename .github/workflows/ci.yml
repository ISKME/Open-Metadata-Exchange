  inn-docker_uv:
    strategy:
      fail-fast: false
      matrix:
        service-image: [cclauss/inn]  # , greenbender/inn]
    runs-on: ubuntu-latest
    services:
      inn-service:
        image: ${{ matrix.service-image }}  # zizmor: ignore[unpinned-images]
        ports:
          - 119:119
          - 563:563
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install  # Version from pyproject.toml project.requires-python
      - run: uv sync --group dev
      - run: uv run pytest --iterations=8 --parallel-threads=auto --ignore-gil-enabled
      - run: uv run scripts/nntp_io.py

  front-end:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.19.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: cd frontend && npm ci || npm install
      - run: cd frontend && npm run  # To see available commands
      # TODO(@KevinEverywhere): Set up eslint/config and then remove `|| true`
      - run: cd frontend && yes | npm init @eslint/config
      - run: cd frontend && npm run lint:scss || true
      - run: cd frontend && npm run lint:ts || true
      - run: cd frontend && npm run unit || true
