name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions: {}
jobs:
  shellcheck:
    runs-on: ubuntu-slim
    steps:  # See configuration in .shellcheckrc
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: find . -type f -name "*.sh" -exec shellcheck {} +

