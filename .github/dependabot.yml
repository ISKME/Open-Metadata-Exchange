# Keep GitHub Actions up to date with GitHub's Dependabot...
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#package-ecosystem
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"  # Group all Actions updates into a single larger pull request
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: /
    groups:
      uv:
        patterns:
          - "*"  # Group all uv updates into a single larger pull request
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /frontend
    groups:
      npm:
        update-types:
          - minor
          - patch  # Group all minor and patch updates into a single pull request, majors get their own
    ignore:  # Held back on purpose, see CONTRIBUTING.md
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: react-dom
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: "@types/react-dom"
        versions: [">=19"]
      - dependency-name: video.js
        versions: [">=9"]
      - dependency-name: "@grapesjs/react"
        versions: [">=2"]
      - dependency-name: grapesjs
        versions: [">=0.23"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
