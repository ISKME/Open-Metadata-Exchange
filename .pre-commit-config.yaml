
# Learn more about this config here: https://pre-commit.com/

# To enable these pre-commit hooks run:
# `pipx install pre-commit` or `brew install pre-commit`
# Then in the project root directory run `pre-commit install`
# and `cd frontend && npm ci` for the eslint and stylelint hooks

# The eslint and stylelint hooks at the bottom use the packages in frontend/node_modules,
# which pre-commit.ci does not install, so pre-commit.ci skips them. The front-end job in
# .github/workflows/ci.yml runs the same checks on every pull request.
ci:
  skip: [eslint, stylelint]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: "frontend/tsconfig.json"
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude_types: [perl]
      - id: check-symlinks
        exclude: server_config/frontend_server/dev/etc/nginx/modules
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: file-contents-sorter
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
        args:
          - --fix=lf
      #- id: name-tests-test
      #- id: pretty-format-json
      #  exclude: fe/jsconfig.json
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace

  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: 0.4.1
    hooks:
      - id: auto-walrus

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell # See pyproject.toml for args
        additional_dependencies:
          - tomli

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.6
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.2
    hooks:
      - id: rumdl      # Lint only (fails on issues)
      # - id: rumdl-fmt  # Auto-format and fail if issues remain

  # - repo: https://github.com/astral-sh/ty-pre-commit
  #   rev: v0.0.72
  #   hooks:
  #     - id: ty

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 'v0.27'
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
    - id: zizmor

  # Lint the staged frontend files before each commit, with the same config as
  # `npm run lint:ts` and `npm run lint:scss`. These hooks need the frontend packages, so run
  # `cd frontend && npm ci` once. Without them the hooks fail with that hint. They only run
  # when a commit touches a .ts, .tsx or .scss file under frontend/.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        entry: >-
          bash -c 'cd frontend && if [ ! -x node_modules/.bin/eslint ]; then
          echo "Run \"cd frontend && npm ci\" first"; exit 1; fi;
          node_modules/.bin/eslint "${@#frontend/}"' --
      - id: stylelint
        name: stylelint (frontend)
        language: system
        files: ^frontend/.*\.scss$
        entry: >-
          bash -c 'cd frontend && if [ ! -x node_modules/.bin/stylelint ]; then
          echo "Run \"cd frontend && npm ci\" first"; exit 1; fi;
          node_modules/.bin/stylelint "${@#frontend/}"' --
